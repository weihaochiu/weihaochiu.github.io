name: Update Unpaywall Open Access Links

on:
  workflow_dispatch:

  schedule:
    # 每週一凌晨 2:00（台灣時間）執行
    - cron: "0 18 * * 0"

  push:
    branches: [main]
    paths:
      - "data/publications.json"
      - "scripts/update_unpaywall.py"
      - ".github/workflows/update-unpaywall.yml"

permissions:
  contents: write

concurrency:
  group: website-content-write
  queue: max
  cancel-in-progress: false

jobs:
  update-unpaywall:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update Unpaywall data
        env:
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: python scripts/update_unpaywall.py

      - name: Commit updated Unpaywall data
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/unpaywall.json; then
            echo "No Unpaywall changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/unpaywall.json
          git commit -m "Update Unpaywall open-access links"
          git reset --hard HEAD
          git clean -fd

          for attempt in 1 2 3 4; do
            echo "Push attempt ${attempt}/4"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Unpaywall update conflicts with newer main-branch changes."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main changed during push; retrying safely."
            sleep $((attempt * 3))
          done

          echo "::error::Unable to push Unpaywall update after four attempts."
          exit 1
