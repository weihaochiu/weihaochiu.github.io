name: Check academic records

on:
  workflow_dispatch:
  schedule:
    # Monday and Thursday 09:10 Asia/Taipei (01:10 UTC)
    - cron: "10 1 * * 1,4"
  push:
    branches: [main]
    paths:
      - "data/academic_monitor_review_decisions.json"
      - "data/publications.json"
      - "data/publication_taxonomy.json"
      - "data/patents.json"
      - "data/patent_families.json"
      - "data/patent_metadata.json"
      - "data/authors.json"
      - "data/projects.json"
      - "data/grb_projects_pending.json"
      - "data/grb_projects_snapshot.json"
      - "scripts/academic_monitor_common.py"
      - "scripts/check_academic_monitor.py"
      - "scripts/check_publications.py"
      - "scripts/validate_publications.py"
      - "scripts/check_patents.py"
      - "scripts/patent_common.py"
      - "scripts/sync_patent_inventors.py"
      - "scripts/validate_patents.py"
      - "scripts/check_projects.py"
      - ".github/workflows/check-academic-monitor.yml"

permissions:
  contents: write

concurrency:
  group: academic-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORCID_ID: "0000-0003-4484-3117"
      CONTACT_EMAIL: "weihao.chiu@gmail.com"
      REPOSITORY_URL: "https://github.com/weihaochiu/weihaochiu.github.io"
      TZ: "Asia/Taipei"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check publications, patents and GRB projects
        run: |
          python scripts/sync_patent_inventors.py --check
          python scripts/validate_patents.py
          python scripts/validate_publications.py
          python scripts/check_academic_monitor.py

      - name: Validate monitor JSON
        run: |
          python -m json.tool data/academic-monitor.json > /dev/null
          python -m json.tool data/academic_monitor_review_decisions.json > /dev/null

      - name: Commit monitor result
        shell: bash
        run: |
          if git diff --quiet -- data/academic-monitor.json; then
            echo "No monitor changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Avoid the non-fast-forward commit failures seen when another
          # workflow updates main during this run.
          git add data/academic-monitor.json
          git commit -m "Update academic record monitor"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
