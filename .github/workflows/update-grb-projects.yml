name: Update GRB projects

on:
  workflow_dispatch:
  schedule:
    # 08:30 Asia/Taipei every Monday and Thursday, before academic monitoring.
    - cron: "30 0 * * 1,4"
  push:
    branches: [main]
    paths:
      - "scripts/update_grb_projects.py"
      - "scripts/update_grb_projects_browser.py"
      - "scripts/update_grb_project_content.py"
      - "data/projects.json"
      - "data/grb_project_sources.json"
      - ".github/workflows/update-grb-projects.yml"

permissions:
  contents: write

concurrency:
  group: website-content-write
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Test GRB parsers
        run: |
          python scripts/update_grb_projects.py --self-test
          python scripts/update_grb_project_content.py --self-test
      - name: Fill blank GRB fields from exact-format records
        run: python scripts/update_grb_projects.py --patch-ui --allow-network-failure
      - name: Capture direct GRB HTTP diagnostics
        continue-on-error: true
        run: |
          mkdir -p grb_debug
          curl -sS -L --connect-timeout 15 --max-time 45 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" \
            -D grb_debug/curl-18623445-headers.txt \
            -o grb_debug/curl-18623445.html \
            "https://www.grb.gov.tw/search/planDetail?id=18623445"
          curl -sS -L --connect-timeout 15 --max-time 45 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" \
            -D grb_debug/curl-19484167-headers.txt \
            -o grb_debug/curl-19484167.html \
            "https://www.grb.gov.tw/search/planDetail?id=19484167"
      - name: Render JavaScript-driven GRB data
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/update_grb_projects_browser.py
      - name: Fill blank GRB content fields from exact labels
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/update_grb_project_content.py --allow-network-failure
      - name: Upload GRB diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grb-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            grb_debug/
            data/grb_projects_snapshot.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate generated data
        run: |
          python scripts/update_grb_projects.py --validate-only
          python scripts/update_grb_project_content.py --validate-only
          python -m json.tool data/projects.json >/dev/null
          python -m json.tool data/grb_project_sources.json >/dev/null
          python -m json.tool data/grb_projects_snapshot.json >/dev/null
          python -m json.tool data/grb_projects_pending.json >/dev/null
          git diff --check
      - name: Commit GRB updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            assets/js/app.js \
            assets/css/styles.css \
            data/projects.json \
            data/grb_project_sources.json \
            data/site_meta.json \
            data/grb_projects_snapshot.json \
            data/grb_projects_pending.json
          if git diff --cached --quiet; then
            echo "No GRB changes."
            exit 0
          else
            git commit -m "Fill blank GRB project fields"
          fi

          # Generated diagnostics and other files outside the commit scope can
          # prevent a rebase. Keep only the committed GRB update.
          git reset --hard HEAD
          git clean -fd

          # Another content workflow or a manual edit may update main while
          # this job is running. Rebase and retry instead of failing with
          # "main -> main (fetch first)".
          for attempt in 1 2 3 4; do
            echo "Push attempt ${attempt}/4"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::GRB update conflicts with newer main-branch changes."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main changed during push; retrying safely."
            sleep $((attempt * 3))
          done

          echo "::error::Unable to push GRB update after four attempts."
          exit 1
