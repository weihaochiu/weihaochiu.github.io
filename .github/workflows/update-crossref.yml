name: Update Crossref publication citations

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * 1"
  push:
    branches: [main]
    paths:
      - "data/publications.json"
      - "scripts/update_crossref_publications.py"
      - ".github/workflows/update-crossref.yml"

permissions:
  contents: write

# Every workflow that commits generated website data uses the same group.
# This prevents Crossref, OpenAlex, Unpaywall, SEO and authorship jobs from
# trying to push to main at the same time.
concurrency:
  group: website-content-write
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # A queued push-triggered run must start from the latest main branch,
          # not from the older commit that originally triggered the run.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch Crossref citation counts
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: python scripts/update_crossref_publications.py

      - name: Rebuild static publication pages
        run: python scripts/build_seo.py

      - name: Commit updated data and pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/crossref_publication_metrics.json \
            publications.html publications \
            sitemap.xml robots.txt llms.txt

          if git diff --cached --quiet; then
            echo "Crossref metrics have not changed."
            exit 0
          fi

          git commit -m "Update Crossref publication citations"

          # Protect against a remote update that lands while this job is running.
          # Rebase rather than force-push so no newer main-branch commit is lost.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
