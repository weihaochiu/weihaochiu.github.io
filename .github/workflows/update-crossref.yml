name: Update Crossref publication citations

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * 1"
  push:
    branches: [main]
    paths:
      - "data/publications.json"
      - "scripts/update_crossref_publications.py"
      - ".github/workflows/update-crossref.yml"

permissions:
  contents: write

concurrency:
  group: website-content-write
  queue: max
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch Crossref citation counts
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: python scripts/update_crossref_publications.py

      - name: Rebuild static publication pages
        run: python scripts/build_seo.py

      - name: Commit updated data and pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            data/crossref_publication_metrics.json \
            publications.html publications \
            sitemap.xml robots.txt llms.txt

          if git diff --cached --quiet; then
            echo "Crossref metrics have not changed."
            exit 0
          fi

          git commit -m "Update Crossref publication citations"

          # build_seo.py may update files outside this workflow's commit scope.
          # Remove those runner-local changes so rebase can proceed cleanly.
          git reset --hard HEAD
          git clean -fd

          for attempt in 1 2 3 4; do
            echo "Push attempt ${attempt}/4"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Crossref update conflicts with newer main-branch changes."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main changed during push; retrying safely."
            sleep $((attempt * 3))
          done

          echo "::error::Unable to push Crossref update after four attempts."
          exit 1
