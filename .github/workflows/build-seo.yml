name: Build v24 AI and scholarly metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/publications.json"
      - "data/authors.json"
      - "data/patents.json"
      - "data/patent_families.json"
      - "data/patent_metadata.json"
      - "data/openalex_publication_metrics.json"
      - "data/openalex_citation_history.json"
      - "data/crossref_publication_metrics.json"
      - "data/mendeley_metrics.json"
      - "data/unpaywall.json"
      - "data/publication_taxonomy.json"
      - "scripts/build_seo.py"
      - "scripts/build_patent_pages.py"
      - "scripts/patent_common.py"
      - "scripts/sync_publication_authors.py"
      - "scripts/sync_patent_inventors.py"
      - "scripts/validate_patents.py"
      - "scripts/update_publication_authorships.py"
      - "assets/css/styles.css"
      - "assets/js/app.js"
      - "publication-insights-4d8c7a.html"
      - "patents.html"
      - ".github/workflows/build-seo.yml"

permissions:
  contents: write

concurrency:
  group: website-content-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Synchronize publication authors
        run: python scripts/sync_publication_authors.py

      - name: Synchronize patent inventors
        run: python scripts/sync_patent_inventors.py

      - name: Generate v24 website files
        run: |
          python scripts/build_seo.py
          python scripts/build_patent_pages.py

      - name: Verify generated publication and patent metadata
        run: |
          python scripts/update_publication_authorships.py --check --allow-missing
          python scripts/sync_publication_authors.py --check
          python scripts/sync_patent_inventors.py --check
          python scripts/validate_patents.py
          python scripts/build_seo.py
          python scripts/build_patent_pages.py
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          expected = len(json.loads((root / 'data/publications.json').read_text(encoding='utf-8')))
          page = (root / 'publications.html').read_text(encoding='utf-8')
          titles = len(re.findall(r'<meta\s+name=["\']citation_title["\']', page, flags=re.I))
          detail_pages = len(list((root / 'publications').glob('*.html')))
          legacy_scripts = len(re.findall(r'openalex-publications\.js', page, flags=re.I))
          marker_starts = page.count('<!-- SEO_CITATION_META_START -->')
          marker_ends = page.count('<!-- SEO_CITATION_META_END -->')
          insights = (root / 'publication-insights-4d8c7a.html').read_text(encoding='utf-8')
          errors = []
          if titles != expected:
              errors.append(f'citation_title count: expected {expected}, found {titles}')
          if detail_pages != expected:
              errors.append(f'detail page count: expected {expected}, found {detail_pages}')
          if legacy_scripts:
              errors.append(f'legacy OpenAlex scripts: expected 0, found {legacy_scripts}')
          if (marker_starts, marker_ends) != (1, 1):
              errors.append(f'citation marker pairs: expected 1/1, found {marker_starts}/{marker_ends}')
          if 'PUBLICATION_AUTHORSHIP_INSIGHTS_START' not in insights:
              errors.append('Publication Analytics authorship extension is missing')
          history = json.loads(
              (root / 'data/openalex_citation_history.json').read_text(encoding='utf-8')
          )
          history_work_count = len(history.get('works') or {})
          static_histories = sum(
              'id="citations-by-year"' in path.read_text(encoding='utf-8')
              for path in (root / 'publications').glob('*.html')
          )
          static_citing_lists = sum(
              'id="citing-articles"' in path.read_text(encoding='utf-8')
              for path in (root / 'publications').glob('*.html')
          )
          if static_histories != history_work_count:
              errors.append(
                  f'static citation histories: expected {history_work_count}, '
                  f'found {static_histories}'
              )
          if static_citing_lists != history_work_count:
              errors.append(
                  f'static citing lists: expected {history_work_count}, '
                  f'found {static_citing_lists}'
              )

          patents = json.loads((root / 'data/patents.json').read_text(encoding='utf-8'))
          patent_families = json.loads((root / 'data/patent_families.json').read_text(encoding='utf-8'))
          patent_page = (root / 'patents.html').read_text(encoding='utf-8')
          patent_static_document_cards = len(
              re.findall(r'<article class="collection-card patent-card"', patent_page)
          )
          patent_static_family_cards = len(
              re.findall(r'<article class="collection-card patent-family-card"', patent_page)
          )
          patent_detail_pages = len([
              path for path in (root / 'patents').glob('*.html')
              if not path.name.startswith('families-')
          ])
          multi_document_families = [
              family for family in patent_families
              if len(family.get('documents') or []) > 1
          ]
          patent_family_pages = len(list((root / 'patents').glob('families-*.html')))
          patent_marker_starts = patent_page.count('<!-- PATENT_STATIC_START -->')
          patent_marker_ends = patent_page.count('<!-- PATENT_STATIC_END -->')
          patent_static_cards = patent_static_document_cards + patent_static_family_cards
          if patent_static_cards != len(patent_families):
              errors.append(
                  f'patent family cards: expected {len(patent_families)}, '
                  f'found {patent_static_cards}'
              )
          if patent_detail_pages != len(patents):
              errors.append(f'patent detail pages: expected {len(patents)}, found {patent_detail_pages}')
          if patent_family_pages != len(multi_document_families):
              errors.append(
                  f'integrated patent family pages: expected {len(multi_document_families)}, '
                  f'found {patent_family_pages}'
              )
          if (patent_marker_starts, patent_marker_ends) != (1, 1):
              errors.append(
                  f'patent static marker pairs: expected 1/1, '
                  f'found {patent_marker_starts}/{patent_marker_ends}'
              )
          if errors:
              raise SystemExit('\n'.join(errors))
          print(
              f'Verified {expected} publications and {len(patents)} patent documents; '
              'generated metadata is idempotent.'
          )
          PY

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' publications patents assets/js/app.js assets/css/styles.css data/authors.json data/site_meta.json robots.txt sitemap.xml llms.txt

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "Build v24 AI and scholarly metadata"
          git reset --hard HEAD
          git clean -fd

          for attempt in 1 2 3 4; do
            echo "Push attempt ${attempt}/4"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Generated website files conflict with newer main-branch changes."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main changed during push; retrying safely."
            sleep $((attempt * 3))
          done

          echo "::error::Unable to push generated website files after four attempts."
          exit 1
